name: Deploy Visualizer to GitHub Pages

# Publishes the interactive graph viewer so the README link keeps working.
# Requires the repository's Pages source to be set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - visualizer/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy visualizer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: visualizer

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
