name: Build and Publish Docker Image

# Manual-only: this workflow is only ever triggered from the Actions tab.
# Pushing the "latest" tag is the default; a version input adds an extra tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 8.0.0). Leave empty to publish only 'latest'."
        required: false
        type: string
      platforms:
        description: "Target platforms (comma separated)"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAGS="${IMAGE}:latest"
          if [ -n "${{ inputs.version }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ inputs.version }}"
          fi
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: work/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_TAG=${{ inputs.version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
