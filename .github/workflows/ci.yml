name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q netmalper tests

      - name: Run tests
        run: pytest -v

      - name: Console script smoke test
        run: |
          netmalper --version
          netmalper --help >/dev/null
          python -m netmalper --help >/dev/null

  uv-install:
    name: uv tool install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install via uv tool
        run: uv tool install .

      - name: Smoke test
        run: |
          netmalper --version
          netmalper --help >/dev/null

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          netmalper --version
          python -c "import netmalper, netmalper.cli; print(netmalper.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
