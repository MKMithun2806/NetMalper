<div id="bootstrap" style="position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#05070d;color:#e7ecff;font-family:JetBrains Mono,monospace;">
  <div style="max-width:720px;padding:24px 28px;border:1px solid rgba(145,160,220,0.18);border-radius:20px;background:rgba(10,14,24,0.92);box-shadow:0 24px 80px rgba(0,0,0,0.4);">

    <div style="color:#8b96b8;line-height:1.7;font-size:12px;">Loading React Flow viewer…</div>
    <div id="bootstrap-error" style="margin-top:14px;color:#ff7b72;font-size:12px;line-height:1.6;white-space:pre-wrap;"></div>
  </div>
</div>

<script>
  const bootstrapBox = () => document.getElementById("bootstrap-error");
  const writeBootstrapError = (value) => {
    const box = bootstrapBox();
    if (box) box.textContent = String(value || "");
  };
  window.addEventListener("error", (event) => {
    const msg = event?.error?.stack || event?.message || "Unknown viewer startup error";
    writeBootstrapError(msg);
  });
  window.addEventListener("unhandledrejection", (event) => {
    const reason = event?.reason?.stack || event?.reason?.message || event?.reason || "Unknown promise rejection";
    writeBootstrapError(reason);
  });
  const originalError = console.error.bind(console);
  console.error = (...args) => {
    originalError(...args);
    writeBootstrapError(args.map((item) => {
      if (item instanceof Error) return item.stack || item.message;
      if (typeof item === "string") return item;
      try { return JSON.stringify(item); } catch { return String(item); }
    }).join(" "));
  };
  const originalWarn = console.warn.bind(console);
  console.warn = (...args) => {
    originalWarn(...args);
    const box = bootstrapBox();
    if (box && !box.textContent) {
      box.textContent = args.map((item) => String(item)).join(" ");
    }
  };
</script>

const html = htm.bind(React.createElement);
const { useEffect, useMemo, useRef, useState } = React;

const TYPE_CFG = {
  root: { color: "#ff7a7a", width: 290 },
  subdomain: { color: "#73f0dd", width: 270 },
  cname: { color: "#f78ad7", width: 250 },
  dns_record: { color: "#b59dff", width: 250 },
  ip: { color: "#70d5ff", width: 250 },
  port: { color: "#a2e3b7", width: 240 },
  endpoint: { color: "#ffe08a", width: 240 },
  service: { color: "#91f1f2", width: 230 },
  os_guess: { color: "#ff9d67", width: 260 },
  nse_finding: { color: "#f4b34f", width: 270 },
  default: { color: "#94a0c8", width: 240 },
};

const TYPE_LEVEL = {
  root: 0,
  subdomain: 1,
  cname: 1,
  dns_record: 1,
  ip: 2,
  endpoint: 3,
  port: 3,
  service: 4,
  os_guess: 4,
  nse_finding: 5,
};

const EDGE_COLOR = "rgba(151, 166, 221, 0.55)";
const EDGE_ACTIVE = "rgba(255, 255, 255, 0.92)";
const NODE_SPACING_X = 300;
const NODE_SPACING_Y = 150;

function text(v) {
  if (v === null || v === undefined) return "";
  if (Array.isArray(v)) return v.map(text).filter(Boolean).join(", ");
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

function flag(value, yes = "yes", no = "no") {
  if (value === undefined || value === null) return "—";
  return value ? yes : no;
}

function formatTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return String(ts);
  return d.toLocaleString(undefined, {
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function formatDuration(v) {
  if (v === null || v === undefined || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return String(v);
  return `${n.toFixed(n < 10 ? 2 : 1)}s`;
}

function summarizeNode(node) {
  const d = node.data || {};
  switch (node.type) {
    case "root":
      return d.fqdn || node.label;
    case "subdomain":
      return Array.isArray(d.ips) && d.ips.length ? `${d.ips.length} IP${d.ips.length === 1 ? "" : "s"}` : "subdomain";
    case "cname":
      return d.fqdn || "CNAME";
    case "dns_record":
      return d.record_type ? `${d.record_type} record` : "DNS record";
    case "ip":
      return d.is_private ? "private IP" : (d.reverse_dns && d.reverse_dns !== node.label ? d.reverse_dns : "public IP");
    case "port":
      return [d.service, d.port ? `:${d.port}` : ""].filter(Boolean).join(" ");
    case "endpoint":
      return [d.status ? `HTTP ${d.status}` : "", d.server || ""].filter(Boolean).join(" • ") || "endpoint";
    case "service":
      return d.service || "service";
    case "os_guess":
      return d.accuracy ? `${d.accuracy}% confidence` : "OS guess";
    case "nse_finding":
      return d.script_id || "NSE output";
    default:
      return d.service || "";
  }
}

function subtitleNode(node) {
  const d = node.data || {};
  switch (node.type) {
    case "root":
      return d.fqdn || "";
    case "subdomain":
      return d.fqdn || node.label;
    case "cname":
      return d.fqdn || "";
    case "ip":
      return [d.ip, d.reverse_dns && d.reverse_dns !== d.ip ? d.reverse_dns : "", d.is_private ? "private" : "public"].filter(Boolean).join(" • ");
    case "port":
      return [d.host, d.service, d.version_str].filter(Boolean).join(" • ");
    case "endpoint":
      return [d.url, d.content_type, d.server].filter(Boolean).join(" • ");
    case "os_guess":
      return [d.os_name, d.host].filter(Boolean).join(" • ");
    case "nse_finding":
      return [d.port ? `port ${d.port}` : "", d.host].filter(Boolean).join(" • ");
    default:
      return [d.host || "", d.service || ""].filter(Boolean).join(" • ");
  }
}

function normalizeGraph(raw) {
  const nodes = Array.isArray(raw?.nodes) ? raw.nodes : [];
  const edges = Array.isArray(raw?.edges) ? raw.edges : [];
  const meta = raw?.meta && typeof raw.meta === "object" ? { ...raw.meta } : {};

  const normNodes = nodes.map((node, index) => {
    const id = String(node?.id ?? `node-${index}`);
    const label = String(node?.label ?? id);
    const type = String(node?.type ?? "default");
    const data = node?.data && typeof node.data === "object" ? { ...node.data } : {};
    const searchText = [id, label, type, text(data)].join(" ").toLowerCase();
    return {
      id,
      label,
      type,
      data,
      summary: summarizeNode({ type, label, data }),
      subtitle: subtitleNode({ type, label, data }),
      searchText,
    };
  });

  const normEdges = edges.map((edge, index) => {
    const source = String(edge?.source ?? "");
    const target = String(edge?.target ?? "");
    return {
      id: String(edge?.id ?? `edge-${index}-${source}-${target}`),
      source,
      target,
      label: String(edge?.label ?? ""),
    };
  }).filter((edge) => edge.source && edge.target);

  meta.node_count = meta.node_count ?? normNodes.length;
  meta.edge_count = meta.edge_count ?? normEdges.length;

  const nodeMap = new Map(normNodes.map((node) => [node.id, node]));
  return {
    meta,
    nodes: normNodes,
    edges: normEdges,
    nodeMap,
    signature: `${meta.timestamp || "no-ts"}:${normNodes.length}:${normEdges.length}`,
  };
}

function buildLayout(graph, showLabels) {
  const grouped = new Map();
  graph.nodes.forEach((node) => {
    const level = TYPE_LEVEL[node.type] ?? 2;
    if (!grouped.has(level)) grouped.set(level, []);
    grouped.get(level).push(node);
  });

  const flowNodes = [];
  [...grouped.entries()].sort((a, b) => a[0] - b[0]).forEach(([level, items]) => {
    items.sort((a, b) => a.label.localeCompare(b.label) || a.id.localeCompare(b.id));
    const height = Math.max(0, (items.length - 1) * NODE_SPACING_Y);

    items.forEach((node, index) => {
      const cfg = TYPE_CFG[node.type] || TYPE_CFG.default;
      const isRoot = node.type === "root";
      flowNodes.push({
        id: node.id,
        type: "entity",
        position: {
          x: level * NODE_SPACING_X,
          y: index * NODE_SPACING_Y - height / 2,
        },
        sourcePosition: Position.Right,
        targetPosition: Position.Left,
        data: {
          label: node.label,
          nodeType: node.type,
          accent: cfg.color,
          summary: node.summary,
          subtitle: node.subtitle,
          details: node.data,
          searchText: node.searchText,
          showLabels,
          root: isRoot,
          muted: false,
          focused: true,
        },
        style: {
          width: cfg.width,
          zIndex: isRoot ? 10 : 1,
        },
      });
    });
  });

  const flowEdges = graph.edges.map((edge) => ({
    id: edge.id,
    source: edge.source,
    target: edge.target,
    label: showLabels ? edge.label : "",
    data: { baseLabel: edge.label },
    type: "smoothstep",
    markerEnd: {
      type: MarkerType.ArrowClosed,
      color: EDGE_COLOR,
      width: 16,
      height: 16,
    },
    style: {
      stroke: EDGE_COLOR,
      strokeWidth: 1.4,
    },
    labelStyle: {
      fill: "#c3caf0",
      fontSize: 11,
      fontWeight: 600,
    },
    labelBgStyle: {
      fill: "rgba(9, 13, 22, 0.9)",
      fillOpacity: 0.92,
    },
    labelBgPadding: [6, 3],
    labelBgBorderRadius: 4,
  }));

  return { flowNodes, flowEdges };
}

function collectFocus(graph, selectedId) {
  const visible = new Set();
  const focused = new Set();
  const connections = [];
  if (!graph) return { visible, focused, connections };

  graph.nodes.forEach((node) => visible.add(node.id));
  if (!selectedId || !graph.nodeMap.has(selectedId)) {
    graph.nodes.forEach((node) => focused.add(node.id));
    return { visible, focused, connections };
  }

  focused.add(selectedId);
  graph.edges.forEach((edge) => {
    if (edge.source === selectedId || edge.target === selectedId) {
      focused.add(edge.source);
      focused.add(edge.target);
      visible.add(edge.source);
      visible.add(edge.target);
      const neighborId = edge.source === selectedId ? edge.target : edge.source;
      const neighbor = graph.nodeMap.get(neighborId);
      if (neighbor) {
        connections.push({
          id: edge.id,
          node: neighbor,
          via: edge.label || "edge",
          direction: edge.source === selectedId ? "→" : "←",
        });
      }
    }
  });
  return { visible, focused, connections };
}

function buildDetailRows(details) {
  return Object.entries(details || {})
    .filter(([, value]) => value !== null && value !== undefined && value !== "" && !(Array.isArray(value) && value.length === 0))
    .map(([key, value]) => {
      const raw = text(value);
      const cls = key === "status"
        ? (Number(raw) >= 400 ? "bad" : Number(raw) >= 200 ? "good" : "warn")
        : "";
      return html`
        <div className="kv" key=${key}>
          <div className="kv-key">${key}</div>
          <div className=${`kv-val ${cls}`}>${raw}</div>
        </div>
      `;
    });
}

function EntityNode({ data, selected }) {
  const isRoot = !!data.root;
  return html`
    <div className=${`entity-node entity-${data.nodeType} ${selected ? "is-selected" : ""} ${data.muted ? "is-muted" : ""} ${isRoot ? "entity-root" : ""}`}
         style=${{ "--accent": data.accent || TYPE_CFG.default.color }}>
      <${Handle} type="target" position=${Position.Left} className="entity-handle" />
      <div className="entity-head">
        <span className="entity-badge">${data.nodeType.replace(/_/g, " ")}</span>
        <span className="entity-state">${data.summary || ""}</span>
      </div>
      <div className="entity-title">${data.label}</div>
      ${data.showLabels ? html`<div className="entity-subtitle">${data.subtitle || ""}</div>` : null}
      <${Handle} type="source" position=${Position.Right} className="entity-handle" />
    </div>
  `;
}

function App() {
  const [graph, setGraph] = useState(null);
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [search, setSearch] = useState("");
  const [hiddenTypes, setHiddenTypes] = useState(() => new Set());
  const [selectedId, setSelectedId] = useState(null);
  const [hoverText, setHoverText] = useState("");
  const [showLabels, setShowLabels] = useState(true);
  const [loaderHidden, setLoaderHidden] = useState(false);
  const [error, setError] = useState("");
  const flowRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => {
    window.__viewerMounted = true;
    document.getElementById("bootstrap")?.remove();
  }, []);

  const focus = useMemo(() => collectFocus(graph, selectedId), [graph, selectedId]);

  useEffect(() => {
    if (!graph) return;
    const term = search.trim().toLowerCase();
    setNodes((current) => current.map((node) => {
      const raw = graph.nodeMap.get(node.id);
      if (!raw) return node;
      const match = !term || raw.searchText.includes(term);
      const keptBySelection = selectedId && focus.focused.has(node.id);
      const visible = !hiddenTypes.has(raw.type) && (match || keptBySelection);
      const active = !selectedId || focus.focused.has(node.id);
      const opacity = selectedId ? (active ? 1 : 0.12) : 1;
      return {
        ...node,
        hidden: !visible,
        data: {
          ...node.data,
          showLabels,
          muted: selectedId ? !active : false,
          focused: active,
        },
        style: {
          ...node.style,
          opacity,
          filter: active ? "saturate(1)" : "saturate(0.7)",
          transition: "opacity 160ms ease, filter 160ms ease, transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease",
          zIndex: active ? 5 : 1,
        },
      };
    }));
    setEdges((current) => current.map((edge) => {
      const source = graph.nodeMap.get(edge.source);
      const target = graph.nodeMap.get(edge.target);
      if (!source || !target) {
        return { ...edge, hidden: true };
      }
      const sourceVisible = !hiddenTypes.has(source.type) && (!term || source.searchText.includes(term) || (selectedId && focus.focused.has(source.id)));
      const targetVisible = !hiddenTypes.has(target.type) && (!term || target.searchText.includes(term) || (selectedId && focus.focused.has(target.id)));
      const active = selectedId && (edge.source === selectedId || edge.target === selectedId);
      const visible = sourceVisible && targetVisible;
      return {
        ...edge,
        hidden: !visible,
        animated: !!active,
        label: showLabels ? edge.data.baseLabel : "",
        style: {
          ...edge.style,
          stroke: active ? EDGE_ACTIVE : EDGE_COLOR,
          strokeWidth: active ? 2.4 : 1.4,
          opacity: selectedId ? (active ? 1 : 0.1) : 1,
        },
        labelStyle: {
          ...edge.labelStyle,
          fill: active ? "#ffffff" : "#c3caf0",
        },
      };
    }));
  }, [graph, search, hiddenTypes, selectedId, showLabels, focus, setNodes, setEdges]);

  useEffect(() => {
    if (!graph || !flowRef.current) return;
    const t = window.setTimeout(() => {
      flowRef.current?.fitView({ padding: 0.22, duration: 450, includeHiddenNodes: false });
    }, 60);
    return () => window.clearTimeout(t);
  }, [graph?.signature]);

  useEffect(() => {
    const query = new URLSearchParams(window.location.search).get("graph");
    if (!query) return;
    loadGraphFromUrl(query);
  }, []);

  function openPicker() {
    fileRef.current?.click();
  }

  function applyGraph(raw, sourceLabel = "graph") {
    try {
      const next = normalizeGraph(raw);
      const initialLayout = buildLayout(next, showLabels);
      setGraph(next);
      setNodes(initialLayout.flowNodes);
      setEdges(initialLayout.flowEdges);
      setSearch("");
      setHiddenTypes(new Set());
      setSelectedId(null);
      setHoverText("");
      setLoaderHidden(true);
      setError("");
      document.title = `netmalper | ${next.meta.target || sourceLabel}`;
    } catch (err) {
      setError(`Invalid graph data: ${err.message}`);
    }
  }

  function loadGraphFromUrl(raw) {
    const url = /^[a-zA-Z][a-zA-Z\d+.-]*:/.test(raw) ? raw : (raw.startsWith("/") ? `file://${raw}` : raw);
    const isLocalFile = url.startsWith("file://");
    fetch(url)
      .then((res) => {
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.json();
      })
      .then((json) => applyGraph(json, raw))
      .catch((err) => {
        const hint = isLocalFile
          ? ' Browsers block fetching local "file://" URLs — use "load JSON" or drop the graph file instead.'
          : "";
        setError(`Could not auto-load graph: ${err.message}.${hint}`);
      });
  }

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        applyGraph(JSON.parse(ev.target.result), file.name);
      } catch (err) {
        setError(`Invalid JSON: ${err.message}`);
      }
    };
    reader.onerror = () => setError(`Could not read ${file.name}`);
    reader.readAsText(file);
  }

  function loadDemo() {
    applyGraph(DEMO_GRAPH, "demo");
  }

  function toggleType(type) {
    setHiddenTypes((current) => {
      const next = new Set(current);
      if (next.has(type)) next.delete(type);
      else next.add(type);
      return next;
    });
  }

  function resetView() {
    setSearch("");
    setHiddenTypes(new Set());
    setSelectedId(null);
    flowRef.current?.fitView({ padding: 0.22, duration: 350, includeHiddenNodes: false });
  }

  function zoomIn() {
    flowRef.current?.zoomIn?.();
  }

  function zoomOut() {
    flowRef.current?.zoomOut?.();
  }

  function fitView() {
    flowRef.current?.fitView({ padding: 0.22, duration: 350, includeHiddenNodes: false });
  }

  const selectedNode = selectedId ? graph?.nodeMap.get(selectedId) : null;
  const selectedConnections = focus.connections;
  const visibleCounts = useMemo(() => {
    const counts = {};
    graph?.nodes.forEach((node) => {
      counts[node.type] = (counts[node.type] || 0) + 1;
    });
    return counts;
  }, [graph]);

  const meta = graph?.meta || {};
  const targetLabel = meta.target || "—";
  const nodeTotal = meta.node_count ?? graph?.nodes.length ?? "—";
  const edgeTotal = meta.edge_count ?? graph?.edges.length ?? "—";
  const scanTime = formatTime(meta.timestamp);
  const duration = formatDuration(meta.duration_s);

  const focusSummary = selectedNode
    ? `${selectedNode.label} • ${selectedNode.type}`
    : hoverText || "drag to pan • scroll to zoom • click nodes for details";

  return html`
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-title">net<span className="accent">malper</span></div>
          <div className="brand-subtitle">react flow intelligence map</div>
        </div>

        <div className="meta-strip">
          <div className="meta-chip"><span className="dot"></span>target <strong>${targetLabel}</strong></div>
          <div className="meta-chip">nodes <strong>${nodeTotal}</strong></div>
          <div className="meta-chip">edges <strong>${edgeTotal}</strong></div>
          <div className="meta-chip">scanned <strong>${scanTime}</strong></div>
          <div className="meta-chip">duration <strong>${duration}</strong></div>
          <div className="meta-chip">nmap <strong>${flag(meta.nmap_used, "enabled", "off")}</strong></div>
          <div className="meta-chip">naabu <strong>${flag(meta.naabu_used, "enabled", "off")}</strong></div>
          <div className="meta-chip">amass <strong>${flag(meta.amass_used, "enabled", "off")}</strong></div>
          <div className="meta-chip">root <strong>${flag(meta.root_scan)}</strong></div>
        </div>

        <div className="top-actions">
          <input
            className="search"
            placeholder="filter nodes, labels, or raw data"
            value=${search}
            onInput=${(ev) => setSearch(ev.target.value)}
          />
          <button className="ghost-btn" onClick=${openPicker}>load JSON</button>
          <input
            className="file-input"
            type="file"
            accept=".json,application/json"
            ref=${fileRef}
            onChange=${(ev) => {
              const file = ev.target.files && ev.target.files[0];
              if (file) loadFile(file);
              ev.target.value = "";
            }}
          />
        </div>
      </div>

      <div className="stage">
        ${graph ? html`
          <${ReactFlow}
            nodes=${nodes}
            edges=${edges}
            onNodesChange=${onNodesChange}
            onEdgesChange=${onEdgesChange}
            onInit=${(instance) => { flowRef.current = instance; }}
            nodeTypes=${{ entity: EntityNode }}
            minZoom=${0.12}
            maxZoom=${2.4}
            fitView
            fitViewOptions=${{ padding: 0.22 }}
            panOnDrag
            zoomOnScroll
            zoomOnPinch
            preventScrolling
            nodesDraggable
            nodesConnectable=${false}
            elementsSelectable
            onNodeClick=${(_, node) => setSelectedId(node.id)}
            onPaneClick=${() => setSelectedId(null)}
            onNodeMouseEnter=${(_, node) => setHoverText(`${node.data.nodeType}: ${node.data.label}`)}
            onNodeMouseLeave=${() => setHoverText("")}
            defaultEdgeOptions=${{ type: "smoothstep" }}
          >
            <${Background}
              variant=${BackgroundVariant.Dots}
              gap=${22}
              size=${1}
              color="rgba(127, 146, 204, 0.16)"
              bgColor="transparent"
            />
            <${MiniMap}
              position="bottom-left"
              pannable
              zoomable
              bgColor="#0a0f1c"
              nodeStrokeWidth=${2}
              nodeColor=${(node) => (TYPE_CFG[node.data?.nodeType] || TYPE_CFG.default).color}
              nodeStrokeColor=${(node) => (TYPE_CFG[node.data?.nodeType] || TYPE_CFG.default).color}
              ariaLabel="NetMalper minimap"
            />
          </${ReactFlow}>
        ` : null}
      </div>

      <div className=${`legend ${graph ? "" : "hidden"}`}>
        <div className="panel-head">
          <div>
            <div className="panel-kicker">node types</div>
            <div className="panel-title">Legend</div>
          </div>
          <button className="close-btn" onClick=${resetView} title="Reset filters">↺</button>
        </div>
        <div className="panel-body">
          <div className="legend-list">
            ${Object.entries(visibleCounts).sort((a, b) => a[0].localeCompare(b[0])).map(([type, count]) => {
              const cfg = TYPE_CFG[type] || TYPE_CFG.default;
              const hidden = hiddenTypes.has(type);
              return html`
                <button
                  className=${`legend-item ${hidden ? "hidden" : ""}`}
                  onClick=${() => toggleType(type)}
                  key=${type}
                >
                  <span className="legend-swatch" style=${{ background: cfg.color, color: cfg.color }}></span>
                  <span className="legend-name">${type}</span>
                  <span className="legend-count">${count}</span>
                </button>
              `;
            })}
          </div>
        </div>
      </div>

      <div className=${`details ${selectedNode ? "visible" : ""}`}>
        <div className="panel-head">
          <div>
            <div className="panel-kicker">
              ${selectedNode ? selectedNode.type : "details"}
            </div>
            <div className="panel-title">${selectedNode ? selectedNode.label : "No selection"}</div>
          </div>
          <button className="close-btn" onClick=${() => setSelectedId(null)} title="Close">×</button>
        </div>
        <div className="panel-body details-scroll">
          ${selectedNode ? html`
            <div className="detail-section">
              <div className="node-blurb" style=${{ borderColor: `color-mix(in srgb, ${(TYPE_CFG[selectedNode.type] || TYPE_CFG.default).color} 24%, rgba(145, 160, 220, 0.12))` }}>
                ${selectedNode.summary || "Selected node"}
              </div>
              ${selectedNode.type === "os_guess" && selectedNode.data?.accuracy ? html`
                <div className="node-blurb" style=${{ color: "#f2a76b", borderColor: "rgba(255, 157, 103, 0.2)" }}>
                  ${selectedNode.data.accuracy}% confidence
                </div>
              ` : null}
              ${selectedNode.type === "port" && selectedNode.data?.version_str ? html`
                <div className="node-blurb" style=${{ color: "#92f0b9", borderColor: "rgba(110, 231, 183, 0.22)" }}>
                  ${selectedNode.data.version_str}
                </div>
              ` : null}
              ${selectedNode.type === "nse_finding" && selectedNode.data?.output ? html`
                <div className="code-box">${selectedNode.data.output}</div>
              ` : null}
            </div>

            <div className="detail-section">
              <div className="panel-kicker">details</div>
              <div className="detail-grid">
                ${buildDetailRows(selectedNode.data || {})}
              </div>
            </div>

            <div className="detail-section">
              <div className="panel-kicker">connections (${selectedConnections.length})</div>
              <div className="connections">
                ${selectedConnections.length ? selectedConnections.map(({ id, node, via, direction }) => {
                  const cfg = TYPE_CFG[node.type] || TYPE_CFG.default;
                  return html`
                    <button className="connection" key=${id} onClick=${() => setSelectedId(node.id)}>
                      <span className="connection-dot" style=${{ background: cfg.color }}></span>
                      <span className="connection-body">
                        <span className="connection-title">${node.label}</span>
                        <span className="connection-meta">${direction} ${via}</span>
                      </span>
                    </button>
                  `;
                }) : html`<div className="node-blurb">No direct connections.</div>`}
              </div>
            </div>

            ${selectedNode && hiddenTypes.has(selectedNode.type) ? html`
              <div className="detail-section">
                <div className="node-blurb" style=${{ color: "#f6c177", borderColor: "rgba(246, 193, 119, 0.22)" }}>
                  This node is currently hidden by an active filter.
                </div>
              </div>
            ` : null}
          ` : html`
            <div className="node-blurb">Pick a node to inspect its metadata, outbound edges, and scan output.</div>
          `}
        </div>
      </div>

      <div className="toolbar">
        <button className="tool-btn" onClick=${zoomIn} title="Zoom in">+</button>
        <button className="tool-btn" onClick=${zoomOut} title="Zoom out">−</button>
        <button className="tool-btn" onClick=${fitView} title="Fit to view">⤢</button>
        <button className=${`tool-btn ${showLabels ? "active" : ""}`} onClick=${() => setShowLabels((v) => !v)} title="Toggle labels">𝕃</button>
        <button className="tool-btn" onClick=${resetView} title="Reset filters">↺</button>
      </div>

      <div className="statusbar">
        <div className="status"><strong>${focusSummary}</strong></div>
        <div className="status">search: <strong>${search || "none"}</strong></div>
      </div>

      <div className=${`loader ${loaderHidden ? "hidden" : ""}`}>
        <div className="loader-card">
          <h1 className="loader-title">net<span className="accent">malper</span></h1>
          <div className="loader-copy">
            Drop a NetMalper <code>_graph.json</code> file, load a local scan, or use the demo data to explore the React Flow viewer.
          </div>
          <div className="loader-actions">
            <div
              className="dropzone"
              onClick=${openPicker}
              onDragOver=${(ev) => { ev.preventDefault(); ev.currentTarget.classList.add("dragging"); }}
              onDragLeave=${(ev) => ev.currentTarget.classList.remove("dragging")}
              onDrop=${(ev) => {
                ev.preventDefault();
                ev.currentTarget.classList.remove("dragging");
                const file = ev.dataTransfer.files && ev.dataTransfer.files[0];
                if (file) loadFile(file);
              }}
            >
              <div className="dropzone-icon">⬡</div>
              <div className="dropzone-main">Drop graph.json here</div>
              <div className="dropzone-sub">or click to browse</div>
            </div>
            <button className="ghost-btn" onClick=${loadDemo}>Load demo scan</button>
          </div>
          ${error ? html`<div className="error">${error}</div>` : null}
        </div>
      </div>
    </div>
  `;
}
